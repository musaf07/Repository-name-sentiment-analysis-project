<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentiment Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f5f6fa;
}

/* HERO */
.hero {
    margin: 20px;
    padding: 50px;
    border-radius: 25px;
    background: linear-gradient(135deg,#4f46e5,#9333ea);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.hero h1 { font-size: 36px; }

.hero img { width: 200px; }

/* BUTTONS */
.btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

.btn-white { background: white; color: #4f46e5; }
.btn-outline { background: transparent; border: 1px solid white; color: white; }

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 15px;
    margin: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.green { color: #22c55e; }
.red { color: #ef4444; }
.blue { color: #3b82f6; }

/* MAIN */
.main {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 0.8fr;
    gap: 20px;
    margin: 20px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 15px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    border-radius: 10px;
}

button.analyze {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    background: linear-gradient(135deg,#4f46e5,#9333ea);
    color: white;
    border: none;
    border-radius: 10px;
}

.trend {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}
</style>

</head>

<body>

<div class="hero">
    <div>
        <h1>Analyze Social Media Sentiment & Predict Sales</h1>
        <p>Turn customer opinions into business insights</p>
        <button class="btn btn-white">Start Analysis</button>
        <button class="btn btn-outline">View Reports</button>
    </div>
    <img src="https://cdn-icons-png.flaticon.com/512/4149/4149643.png">
</div>

<div class="cards">
    <div class="card"><h2 id="total">0</h2>Total</div>
    <div class="card"><h2 class="green" id="positive">0</h2>Positive</div>
    <div class="card"><h2 class="red" id="negative">0</h2>Negative</div>
    <div class="card"><h2 class="blue" id="neutral">0</h2>Neutral</div>
    <div class="card"><h2>₹8.4M</h2>Sales</div>
</div>

<div class="main">

<div class="box">
    <h3>Analyze Text</h3>
    <textarea id="text" placeholder="Enter text..."></textarea>
    <button class="analyze" onclick="analyze()">Analyze</button>
    <p id="result"></p>
</div>

<div class="box">
    <h3>Sentiment Chart</h3>
    <canvas id="chart"></canvas>
</div>

<div class="box">
    <h3>Sales</h3>
    <canvas id="sales"></canvas>
</div>

<div class="box">
    <h3>Trends</h3>
    <div class="trend"><span>#NewProduct</span><span class="green">Positive</span></div>
    <div class="trend"><span>#ServiceIssue</span><span class="red">Negative</span></div>
</div>

</div>

<script>
let counts = {positive:0, negative:0, neutral:0};

async function analyze(){
    let text = document.getElementById("text").value.trim();

    if(text === ""){
        document.getElementById("result").innerText = "⚠️ Enter text";
        return;
    }

    try {
        let res = await fetch("/api/sentiment/analyze", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({text})
        });

        let data = await res.json();
        let sentiment = data.sentiment;

        if (sentiment === "Positive") counts.positive++;
        else if (sentiment === "Negative") counts.negative++;
        else counts.neutral++;

        document.getElementById("result").innerText = "Sentiment: " + sentiment;

        update();

    } catch (err) {
        document.getElementById("result").innerText = "❌ Backend not working";
    }
}

function update(){
    document.getElementById("total").innerText =
        counts.positive + counts.negative + counts.neutral;

    document.getElementById("positive").innerText = counts.positive;
    document.getElementById("negative").innerText = counts.negative;
    document.getElementById("neutral").innerText = counts.neutral;

    chart.data.datasets[0].data = [
        counts.positive, counts.negative, counts.neutral
    ];

    chart.update();
}

let chart = new Chart(document.getElementById("chart"), {
    type:'doughnut',
    data:{
        labels:['Positive','Negative','Neutral'],
        datasets:[{
            data:[0,0,0],
            backgroundColor:['#22c55e','#ef4444','#3b82f6']
        }]
    }
});

new Chart(document.getElementById("sales"), {
    type:'line',
    data:{
        labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets:[{
            label:'Sales',
            data:[120,140,150,160,170,180,200]
        }]
    }
});
</script>

</body>
</html>
